server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le chiamate /api vanno al container "backend" (proxy verso la NYT)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }

    # File con hash nel nome: si possono tenere in cache a lungo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single Page App: ogni route sconosciuta restituisce index.html (React Router fa il resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
